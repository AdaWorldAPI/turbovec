[package]
name = "turbovec"
version = "0.9.0"
edition = "2021"
rust-version = "1.95"
description = "Fast vector quantization with 2-4 bit compression and SIMD search"
license = "MIT"
repository = "https://github.com/RyanCodrai/turbovec"
homepage = "https://github.com/RyanCodrai/turbovec"
readme = "../README.md"
keywords = ["vector-search", "quantization", "nearest-neighbor", "ann", "simd"]
categories = ["algorithms", "science", "compression"]

[dependencies]
# AdaWorldAPI fork of ndarray (workspace P0: depend on the fork, NEVER the
# crates.io upstream). The fork IS rust-ndarray 0.17.2 with HPC/SIMD modules
# bolted on, so the core array API (`ArrayView2`, `.dot()`, `.t()`) is
# unchanged AND `ndarray::simd::*` (the SIMD polyfill) becomes available to
# the search kernel. We pull only the core array layer + simd: the one
# `.dot()` in `encode.rs` uses the pure-Rust `matrixmultiply` fallback unless
# the `blas` feature is enabled, so no OpenBLAS/Accelerate link is required by
# default.
ndarray = { path = "../../ndarray", default-features = false, features = ["std"] }
rayon = "1.10"
ordered-float = "4"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
statrs = "0.17"
faer = "0.20"

[features]
default = []

# Re-enable C-BLAS (OpenBLAS on Linux, Accelerate on macOS) for the
# encode-time rotation GEMM. OFF by default — the pure-Rust matrixmultiply
# fallback needs no native library, which keeps `cargo build`/`test`/`bench`
# self-contained. `build.rs` emits the link directive only under this feature.
blas = ["ndarray/blas"]

# Expose the internal kernel-dispatch toggle (FORCE_SCALAR_FALLBACK) outside
# `cfg(test)` so the benchmark can measure the scalar-reference floor against
# the SIMD native kernel and the ndarray::simd polyfill.
bench-internals = []

